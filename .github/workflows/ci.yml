name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Lint
        run: python -m ruff check app tests

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build image
        run: docker build -t querypilot .

  design-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cz-design-system
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cz-design-system/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test and build
        run: npm run check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          (cd packages/cz-design-system && npm ci)
          (cd web && npm ci)
      - name: Typecheck and build
        working-directory: web
        run: npm run check
