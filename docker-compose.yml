services:
  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 应用日志另写一份到数据卷，按天轮转（默认留 14 天、单文件 50MB），重新部署后还在
      - LOG_DIR=/app/logs
    volumes:
      - querypilot-data:/app/data
      - querypilot-logs:/app/logs
    restart: unless-stopped
    # 健康检查：/health 连续 3 次（间隔 5 秒）不通就结束主进程，由上面的 restart 自动拉起。
    # （Docker 自己不会重启 unhealthy 的容器，所以由检查脚本主动退出）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,time,sys\nfor i in range(3):\n try:\n  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10); sys.exit(0)\n except Exception:\n  time.sleep(5)\nsys.exit(1)\" || kill 1"]
      interval: 60s
      timeout: 60s
      start_period: 60s
      retries: 1
    # 重新部署时给进行中的订阅检查 / 转存留时间做完（应用里最多等 60 秒）
    stop_grace_period: 90s
    # 日志只留最近约 30MB（隐私说明里承诺的），自动滚动覆盖
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PanSou 网盘搜索聚合（https://github.com/fish2018/pansou，MIT）：给 QueryPilot 的 agent 当搜索工具。
  # 和 web 在同一个 compose 网络，不映射任何端口，只有 web 能通过 http://pansou:8888 访问。
  # .env 里不写 PANSOU_URL 时 QueryPilot 不会用它（容器照样起，但没人调用）。
  pansou:
    image: ghcr.io/fish2018/pansou:latest  # 上线稳定后建议固定到具体版本 tag
    restart: unless-stopped
    environment:
      # 插件白名单：只开网盘/夸克影视类。PanSou 默认会开成人站和 BT 站插件
      # （javdb、u3c3、nyaa、thepiratebay 等），所以这里必须显式列出，不要改成全部启用
      - ENABLED_PLUGINS=${PANSOU_PLUGINS:-pansearch,qupansou,hunhepan,quark4k,quarksoo,quarktv,quarkres,panlian,yunso,yunsou,sousou,haitunsou,xiaokupan,labi,zhizhen,shandian,muou,duoduo,wanou,ouge,huban,hdmoli,libvio,duanjuw,kkv}
      # TG 频道：默认用下面这组影视 / 夸克资源频道（取自 PanSou README 推荐列表里和影视、夸克相关的）。
      # QueryPilot 只在 .env 设了 PANSOU_SRC=all 时才让 PanSou 搜 TG；且只要夸克链接（cloud_types=quark）。
      # 想换成自己的名单就在 .env 里写 PANSOU_CHANNELS=频道1,频道2（留空用这里的默认）
      - CHANNELS=${PANSOU_CHANNELS:-tgsearchers4,Quark_Movies,ucquark,XiangxiuNBB,ydypzyfx,dianyingshare,yingshifenxiang123,zaihuayun,Q66Share,Oscar_4Kmovies,kkxlzy,baicaoZY,MCPH01,MCPH086,yggpan,ysxb48,jdjdn1111,yunpanx,zyfb123,gotopan,PanjClub,Q_dongman,yoyokuakeduanju}
      - CACHE_TTL=60
      - ASYNC_RESPONSE_TIMEOUT=4
      # - PROXY=socks5://host:port   # 国内服务器访问 TG 需要代理
    volumes:
      - pansou-cache:/app/cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  querypilot-data:
  querypilot-logs:
  pansou-cache:
