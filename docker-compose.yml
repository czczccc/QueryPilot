services:
  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - querypilot-data:/app/data
    restart: unless-stopped

  # PanSou 网盘搜索聚合（https://github.com/fish2018/pansou，MIT），可选：
  #   docker compose --profile pansou up -d
  # 并在 .env 写 PANSOU_URL=http://pansou:8888。不映射端口，只给 web 在内网调用。
  pansou:
    profiles: ["pansou"]
    image: ghcr.io/fish2018/pansou:latest  # 上线后建议固定到具体版本 tag
    restart: unless-stopped
    environment:
      # 插件白名单：只开网盘/夸克影视类，排除成人与 BT 盗版站插件（不要改成全部启用）
      - ENABLED_PLUGINS=pansearch,qupansou,hunhepan,quark4k,quarksoo,quarktv,quarkres,panlian,yunso,yunsou,sousou,haitunsou,xiaokupan,labi,zhizhen,shandian,muou,duoduo,wanou,ouge,huban,hdmoli,libvio,duanjuw,kkv
      # QueryPilot 默认只请求插件结果（PANSOU_SRC=plugin）；要用 TG 频道时，先人工筛好频道再填
      - CHANNELS=
      - CACHE_TTL=60
      - ASYNC_RESPONSE_TIMEOUT=4
      # - PROXY=socks5://host:port   # 国内服务器访问 TG 需要代理
    volumes:
      - pansou-cache:/app/cache

volumes:
  querypilot-data:
  pansou-cache:
