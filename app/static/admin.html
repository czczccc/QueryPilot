<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>站长后台 · QueryPilot</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("qp_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) { /* 跟随系统 */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="/" aria-label="回到 QueryPilot 首页">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-name">QueryPilot</span>
      <span class="admin-tag">站长后台</span>
    </a>
    <div class="topbar-actions">
      <button id="refresh-btn" type="button" class="secondary-btn small" hidden>刷新</button>
      <button id="lock-btn" type="button" class="secondary-btn small" hidden>退出后台</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- 口令 -->
    <section id="login-view" class="card admin-login">
      <h1>站长后台</h1>
      <p class="muted">输入服务器 .env 里的 <code>ADMIN_TOKEN</code>。口令只保存在当前标签页，关掉就会忘记。</p>
      <form id="token-form" class="admin-row" novalidate>
        <label class="visually-hidden" for="token-input">管理口令</label>
        <input id="token-input" type="password" autocomplete="current-password" placeholder="管理口令" required>
        <button type="submit" class="primary-btn small">进入</button>
      </form>
      <p id="login-error" class="admin-error" role="alert" hidden></p>
    </section>

    <div id="app-view" hidden>
      <nav class="admin-tabs" role="tablist" aria-label="后台分区">
        <button type="button" role="tab" class="tab" data-tab="overview" aria-selected="true">概览</button>
        <button type="button" role="tab" class="tab" data-tab="users" aria-selected="false">账号</button>
        <button type="button" role="tab" class="tab" data-tab="usage" aria-selected="false">每日用量</button>
        <button type="button" role="tab" class="tab" data-tab="invites" aria-selected="false">邀请码</button>
        <button type="button" role="tab" class="tab" data-tab="bans" aria-selected="false">封禁 IP</button>
      </nav>

      <!-- 概览 -->
      <section class="tab-panel" data-panel="overview">
        <div id="kpis" class="kpis"></div>
        <div class="card">
          <div class="card-head"><h2>最近 14 天</h2><span class="muted small">宽柱：搜索次数　细条：AI 搜索</span></div>
          <div id="trend" class="trend"></div>
        </div>
        <div class="admin-grid">
          <div class="card">
            <div class="card-head"><h2>今天用量最多</h2></div>
            <div class="table-wrap"><table id="top-table"></table></div>
          </div>
          <div class="card">
            <div class="card-head"><h2>当前额度设置</h2></div>
            <dl id="limits" class="limits"></dl>
            <p class="muted small">这些值来自服务器 .env，改完需要重启服务。0 表示不限。</p>
          </div>
        </div>
      </section>

      <!-- 账号 -->
      <section class="tab-panel" data-panel="users" hidden>
        <div class="card">
          <form id="user-search" class="admin-row" novalidate>
            <label class="visually-hidden" for="user-q">搜索账号</label>
            <input id="user-q" type="search" placeholder="按昵称或账号 id 搜索">
            <button type="submit" class="secondary-btn">搜索</button>
          </form>
          <div class="table-wrap"><table id="users-table"></table></div>
          <div class="pager">
            <button id="users-prev" type="button" class="secondary-btn small">上一页</button>
            <span id="users-page" class="muted small"></span>
            <button id="users-next" type="button" class="secondary-btn small">下一页</button>
          </div>
        </div>
      </section>

      <!-- 每日用量 -->
      <section class="tab-panel" data-panel="usage" hidden>
        <div class="card">
          <form id="usage-form" class="admin-row" novalidate>
            <label for="usage-day" class="muted small">日期</label>
            <input id="usage-day" type="date">
            <button type="submit" class="secondary-btn">查看</button>
          </form>
          <div id="usage-site" class="kpis compact"></div>
          <div class="table-wrap"><table id="usage-table"></table></div>
        </div>
      </section>

      <!-- 邀请码 -->
      <section class="tab-panel" data-panel="invites" hidden>
        <div class="card">
          <form id="invite-form" class="admin-row wrap" novalidate>
            <label class="field">数量<input id="inv-count" type="number" min="1" max="100" value="5"></label>
            <label class="field">每个可用次数<input id="inv-uses" type="number" min="0" max="10000" value="1"></label>
            <label class="field grow">备注<input id="inv-note" type="text" maxlength="60" placeholder="比如：朋友"></label>
            <button type="submit" class="primary-btn small">生成邀请码</button>
          </form>
          <p class="muted small">可用次数填 0 表示不限次数。只有 .env 开启邀请制（新用户需要邀请码）时才会用到。</p>
          <div class="table-wrap"><table id="invites-table"></table></div>
        </div>
      </section>

      <!-- 封禁 IP -->
      <section class="tab-panel" data-panel="bans" hidden>
        <div class="card">
          <form id="ban-form" class="admin-row wrap" novalidate>
            <label class="field">IP 地址<input id="ban-ip" type="text" maxlength="64" placeholder="1.2.3.4" required></label>
            <label class="field grow">原因<input id="ban-reason" type="text" maxlength="100" placeholder="选填，会显示给对方"></label>
            <button type="submit" class="primary-btn small">封禁</button>
          </form>
          <div class="table-wrap"><table id="bans-table"></table></div>
        </div>
      </section>
    </div>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/admin.js"></script>
</body>
</html>
