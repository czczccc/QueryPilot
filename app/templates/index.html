<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夸克网盘资源搜索 - QueryPilot</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>夸克网盘资源搜索</h1>
      <p class="tagline">输入影视/剧集名，agent 自动多轮搜索夸克网盘分享链接、验证有效性并识别清晰度</p>
    </header>

    <section aria-label="搜索输入">
      <form id="search-form" novalidate>
        <label class="visually-hidden" for="query">搜索内容</label>
        <div class="search-row">
          <input id="query" name="query" type="search" autocomplete="off"
                 placeholder="例如：漫长的季节 4K / 绝命律师 全集 / 沙丘2"
                 minlength="2" maxlength="200" required>
          <button id="submit-btn" type="submit">搜索</button>
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="examples" aria-label="示例查询">
          <span>试试：</span>
          <button type="button" class="example" data-query="漫长的季节 4K">漫长的季节</button>
          <button type="button" class="example" data-query="绝命律师 全集">绝命律师</button>
          <button type="button" class="example" data-query="沙丘2 4K HDR">沙丘2</button>
        </div>
      </form>
    </section>

    <details id="prefs-panel" class="prefs" hidden>
      <summary>偏好设置</summary>
      <div class="prefs-body">
        <label class="filter-label">
          默认最低清晰度
          <select id="pref-min-res">
            <option value="">不限</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="2160p">4K</option>
          </select>
        </label>
        <label class="filter-label"><input type="checkbox" id="pref-sub"> 优先带字幕</label>
        <label class="filter-label"><input type="checkbox" id="pref-hdr"> 优先 HDR</label>
        <span id="prefs-saved" class="prefs-saved" aria-live="polite"></span>
      </div>
      <p class="prefs-hint">agent 会把默认清晰度当作搜索目标，偏好的字幕/HDR 资源排在前面。偏好保存在服务器上，对应当前浏览器。</p>
    </details>

    <details id="subs-panel" class="prefs" hidden>
      <summary>我的订阅 <span id="subs-unread" class="unread" hidden></span></summary>
      <ul id="notif-list" class="notif-list"></ul>
      <ul id="subs-list" class="subs-list"></ul>
      <p class="prefs-hint">订阅后服务器会定期替你重搜，有新集数或更高清的版本时在这里提醒。在搜索结果上点「订阅更新」即可添加。</p>
    </details>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <section id="agent-panel" class="card agent-panel" hidden aria-label="搜索过程">
      <h2 id="agent-title">搜索过程</h2>
      <ol id="agent-steps" class="agent-steps"></ol>
    </section>

    <section id="results" hidden aria-label="搜索结果">
      <div id="parsed-card" class="card" hidden></div>
      <div id="metrics" class="metrics" hidden></div>
      <form id="followup-form" class="card followup" hidden novalidate>
        <p id="followup-history" class="followup-history"></p>
        <div class="search-row">
          <label class="visually-hidden" for="followup-input">继续追问</label>
          <input id="followup-input" type="text" autocomplete="off" maxlength="200"
                 placeholder="继续追问：要第二季 / 只要中字的 / 4K 的呢 / 再找找">
          <button id="followup-btn" type="submit" class="secondary-btn">追问</button>
        </div>
      </form>
      <div id="link-actions" class="link-actions" hidden>
        <label class="filter-label">
          <input type="checkbox" id="hide-dead" checked> 只看有效且相关的链接
        </label>
        <label class="filter-label">
          最低清晰度
          <select id="min-res">
            <option value="">不限</option>
            <option value="720p">720p</option>
            <option value="1080p">1080p</option>
            <option value="2160p">4K</option>
          </select>
        </label>
        <button id="copy-btn" type="button" class="secondary-btn">复制全部链接</button>
        <button id="subscribe-btn" type="button" class="secondary-btn" hidden>订阅更新</button>
      </div>
      <ol id="result-list" class="result-list"></ol>
      <div id="empty-state" class="empty" hidden></div>
    </section>

    <footer>
      <p>结果来自公开搜索源，仅供合规用途；链接可达性与内容有效性请自行判断。</p>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
