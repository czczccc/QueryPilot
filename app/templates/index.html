<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryPilot - 可解释的 AI 聚合搜索</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>QueryPilot</h1>
      <p class="tagline">用一句话描述你想找的东西，系统负责理解、搜索，并解释为什么返回这些结果</p>
    </header>

    <section aria-label="搜索输入">
      <form id="search-form" novalidate>
        <label class="visually-hidden" for="query">搜索内容</label>
        <div class="search-row">
          <input id="query" name="query" type="search" autocomplete="off"
                 placeholder="例如：想找一款适合四个人玩的轻量联机游戏，最好支持中文"
                 minlength="2" maxlength="200" required>
          <button id="submit-btn" type="submit">搜索</button>
        </div>
        <p id="form-error" class="form-error" role="alert" hidden></p>
        <div class="examples" aria-label="示例查询">
          <span>试试：</span>
          <button type="button" class="example" data-query="想找一款适合四个人玩的轻量联机游戏，最好支持中文">四人联机游戏</button>
          <button type="button" class="example" data-query="推荐一部悬疑烧脑的电影">悬疑电影</button>
          <button type="button" class="example" data-query="好用的截图工具软件">截图软件</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <section id="results" hidden aria-label="搜索结果">
      <div id="intent-card" class="card" hidden></div>
      <div id="metrics" class="metrics" hidden></div>
      <ol id="result-list" class="result-list"></ol>
      <div id="empty-state" class="empty" hidden></div>
    </section>

    <footer>
      <p>结果来自公开搜索源，相关性分数为启发式结果，不代表真实性或质量保证。</p>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
